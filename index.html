<head>
<meta charset="UTF-8">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  :root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2330;--border:#2a3441;--text:#e6edf3;--text2:#8b949e;--accent:#4ade80;--red:#f85149;--amber:#f0a020;--blue:#58a6ff;--pos:#4ade80;--neg:#f85149;--warn:#f0a020;--mono:'IBM Plex Mono',monospace;--sans:'Space Grotesk',sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;}
  header{padding:20px 28px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,#161b22,#0d1117);position:sticky;top:0;z-index:10;}
  header h1{font-size:18px;font-weight:600;letter-spacing:-0.3px;}
  header h1 span{color:var(--accent);}
  .hright{display:flex;align-items:center;gap:12px;}
  .meta{font-family:var(--mono);font-size:12px;color:var(--text2);text-align:right;}
  #acctFilter{background:var(--panel2);color:var(--text);border:1px solid var(--border);padding:7px 11px;border-radius:7px;font-family:var(--sans);font-size:13px;}
  #acctFilter:focus{border-color:var(--accent);outline:none;}
  #refreshBtn{background:var(--panel2);color:var(--text);border:1px solid var(--border);padding:7px 14px;border-radius:7px;cursor:pointer;font-family:var(--sans);font-size:13px;}
  #refreshBtn:hover{border-color:var(--accent);color:var(--accent);}
  #notifBtn{position:relative;background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:7px 11px;cursor:pointer;font-size:16px;line-height:1;}
  #notifBtn:hover{border-color:var(--accent);}
  #notifBadge{position:absolute;top:-6px;right:-6px;background:var(--neg);color:#fff;border-radius:50%;font-size:10px;font-weight:700;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-family:var(--sans);}
  #notifPanel{display:none;position:absolute;top:64px;right:20px;width:400px;max-height:500px;overflow-y:auto;background:var(--panel2);border:1px solid var(--border);border-radius:12px;z-index:100;box-shadow:0 8px 32px rgba(0,0,0,0.4);}
  #notifPanel.open{display:block;}
  .notif-item{padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;}
  .notif-item:last-child{border-bottom:none;}
  .notif-item:hover{background:var(--panel);}
  .notif-item.unread{border-left:3px solid var(--neg);}
  .notif-title{font-size:13px;font-weight:600;margin-bottom:3px;}
  .notif-body{font-size:12px;color:var(--text2);}
  .notif-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  .notif-header span{font-size:13px;font-weight:600;}
  .notif-header button{font-size:11px;background:none;border:none;color:var(--accent);cursor:pointer;}
  nav{background:var(--panel);border-bottom:1px solid var(--border);}
  #navGroups{display:flex;gap:6px;padding:10px 28px 0;overflow-x:auto;}
  #navGroups button{background:var(--panel2);border:1px solid var(--border);border-bottom:none;color:var(--text2);padding:9px 18px;border-radius:9px 9px 0 0;cursor:pointer;font-family:var(--sans);font-size:13.5px;font-weight:600;white-space:nowrap;}
  #navGroups button:hover{color:var(--text);}
  #navGroups button.active{color:var(--accent);background:var(--bg);border-color:var(--accent);}
  #navTabs{display:flex;gap:3px;padding:7px 28px;overflow-x:auto;background:var(--bg);border-top:1px solid var(--border);}
  #navTabs button{background:none;border:none;color:var(--text2);padding:7px 14px;cursor:pointer;font-family:var(--sans);font-size:13px;border-radius:7px;white-space:nowrap;}
  #navTabs button:hover{color:var(--text);background:var(--panel2);}
  #navTabs button.active{color:var(--accent);background:var(--panel2);font-weight:600;}
  main{padding:24px 28px;}
  .view{display:none;}.view.active{display:block;animation:fade .3s;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:26px;}
  .kpi{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px 20px;position:relative;overflow:hidden;}
  .kpi::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--accent);}
  .kpi.red::before{background:var(--red);}.kpi.amber::before{background:var(--amber);}.kpi.blue::before{background:var(--blue);}
  .kpi .label{font-size:12px;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px;}
  .kpi .value{font-size:28px;font-weight:600;font-family:var(--mono);letter-spacing:-1px;}
  .kpi .sub{font-size:12px;color:var(--text2);margin-top:5px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;margin-bottom:20px;overflow:hidden;}
  .card-head{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  .card-head h2{font-size:15px;font-weight:600;}
  .card-head .hint{font-size:12px;color:var(--text2);}
  .controls{padding:12px 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--border);}
  .controls input,.controls select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:7px 11px;border-radius:7px;font-family:var(--sans);font-size:13px;}
  .controls input{width:200px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;padding:11px 16px;color:var(--text2);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:0.4px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;background:var(--panel);}
  th.num,td.num{text-align:right;}
  td{padding:11px 16px;border-bottom:1px solid var(--border);white-space:nowrap;}
  td.num{font-family:var(--mono);}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--panel2);}
  .table-scroll{max-height:600px;overflow:auto;width:100%;}
  .table-scroll table{min-width:100%;border-collapse:collapse;white-space:nowrap;}
  .table-scroll td, .table-scroll th{max-width:280px;overflow:hidden;text-overflow:ellipsis;}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;font-family:var(--mono);}
  .p-now{background:rgba(248,81,73,.15);color:var(--red);}
  .p-soon{background:rgba(240,160,32,.15);color:var(--amber);}
  .p-ok{background:rgba(74,222,128,.12);color:var(--accent);}
  .p-none{background:rgba(139,148,158,.12);color:var(--text2);}
  .pos{color:var(--accent);}.neg{color:var(--red);}.warn{color:var(--amber);}
  .bar{height:5px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:5px;}
  .bar>div{height:100%;background:var(--accent);}
  .loading{padding:60px;text-align:center;color:var(--text2);font-family:var(--mono);}
  .err{padding:20px;color:var(--red);font-family:var(--mono);font-size:13px;}
  .neg-stock{color:var(--red);font-weight:600;}
  a.asin{color:var(--blue);text-decoration:none;font-family:var(--mono);}
  a.asin:hover{text-decoration:underline;}
  .spark{display:flex;align-items:flex-end;gap:3px;height:50px;}
  .spark div{flex:1;background:var(--accent);opacity:.7;border-radius:2px 2px 0 0;min-height:2px;}
  .spark div:hover{opacity:1;}
  .gup{color:var(--accent);}.gdown{color:var(--red);}
  @media(max-width:768px){
    header{padding:12px 14px;flex-wrap:wrap;gap:8px;}
    header h1{font-size:15px;}
    main{padding:14px 12px;}
    nav{padding:0 8px;}
    nav button{padding:11px 12px;font-size:12.5px;}
    .kpis{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;}
    .kpi{padding:14px 14px;}
    .kpi .value{font-size:21px;}
    #notifPanel{width:calc(100vw - 24px);right:12px;}
    .controls input{width:130px;}
  }

  html[data-theme="light"]{--bg:#f5f7fa;--panel:#ffffff;--panel2:#eef1f5;--border:#d5dbe3;--text:#1a2230;--text2:#5b6675;--accent:#15803d;--red:#dc2626;--amber:#b45309;--blue:#1d4ed8;--pos:#15803d;--neg:#dc2626;--warn:#b45309;color-scheme:light;}
  html[data-theme="light"] header{background:linear-gradient(180deg,#ffffff,#f5f7fa);}
  html[data-theme="light"] #notifPanel{box-shadow:0 8px 28px rgba(0,0,0,.15);}
  html[data-theme="light"] .kpi .value:not(.pos):not(.neg):not(.warn){color:var(--text);}
  #themeBtn{background:var(--panel2);color:var(--text);border:1px solid var(--border);padding:7px 11px;border-radius:7px;cursor:pointer;font-size:15px;line-height:1;}
  #themeBtn:hover{border-color:var(--accent);}
  html[data-theme="light"] .notif-title[style*="#f0b429"]{color:#b45309!important;}
  .kpi{text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;}
  .kpi .label,.kpi .value,.kpi .sub{width:100%;text-align:center;}
  #notifPanel{position:fixed;top:calc(var(--bellB,56px) + 8px);max-height:calc(100vh - var(--bellB,56px) - 24px);}
  .card>.card-head{background:linear-gradient(90deg,color-mix(in srgb,var(--blue) 16%,var(--panel)),var(--panel) 75%);border-left:4px solid var(--blue);border-bottom:1px solid color-mix(in srgb,var(--blue) 35%,var(--border));}
  .card>.card-head h2{font-size:16px;font-weight:700;color:var(--blue);letter-spacing:-.2px;}
  .card>.card-head .hint{color:var(--text2);}
  th{background:var(--panel2)!important;color:var(--text)!important;font-weight:700!important;}
  @media(max-width:768px){.card>.card-head h2{font-size:14.5px;}}
  td[style*="font-size:10"],td[style*="font-size:11"],td[style*="font-size:12"],td[style*="var(--mono)"],td a.asin{font-size:13.5px!important;font-weight:700!important;}
  td[style*="font-size:10"] *,td[style*="font-size:11"] *,td[style*="font-size:12"] *{font-size:inherit!important;}
  @media(max-width:768px){td[style*="font-size:10"],td[style*="font-size:11"],td[style*="font-size:12"],td[style*="var(--mono)"],td a.asin{font-size:12.5px!important;}}
  .hright button[title="Logout"]{background:var(--panel2);color:var(--text);border:1px solid var(--border);padding:7px 12px;border-radius:7px;cursor:pointer;font-family:var(--sans);font-size:13px;}
  .hright button[title="Logout"]:hover{border-color:var(--red);color:var(--red);}
  :root{--ac-AVEDIA:#60a5fa;} html[data-theme="light"]{--ac-AVEDIA:#1d4ed8;}
  :root{--ac-BRAINLE:#c084fc;} html[data-theme="light"]{--ac-BRAINLE:#7e22ce;}
  :root{--ac-MULZI:#4ade80;} html[data-theme="light"]{--ac-MULZI:#15803d;}
  :root{--ac-ZOTIMO:#fb923c;} html[data-theme="light"]{--ac-ZOTIMO:#c2410c;}
  :root{--ac-ACMUST:#f87171;} html[data-theme="light"]{--ac-ACMUST:#b91c1c;}
  :root{--ac-ARKZO:#22d3ee;} html[data-theme="light"]{--ac-ARKZO:#0e7490;}
  :root{--ac-PIVDO:#facc15;} html[data-theme="light"]{--ac-PIVDO:#ca8a04;}
  :root{--ac-KIDOCA:#94a3b8;} html[data-theme="light"]{--ac-KIDOCA:#475569;}
  :root{--ac-WISKA:#b07a4a;} html[data-theme="light"]{--ac-WISKA:#7c4a1e;}
  [data-acct="AVEDIA"]{--ac:var(--ac-AVEDIA);}
  [data-acct="BRAINLE"]{--ac:var(--ac-BRAINLE);}
  [data-acct="MULZI"]{--ac:var(--ac-MULZI);}
  [data-acct="ZOTIMO"]{--ac:var(--ac-ZOTIMO);}
  [data-acct="ACMUST"]{--ac:var(--ac-ACMUST);}
  [data-acct="ARKZO"]{--ac:var(--ac-ARKZO);}
  [data-acct="PIVDO"]{--ac:var(--ac-PIVDO);}
  [data-acct="KIDOCA"]{--ac:var(--ac-KIDOCA);}
  [data-acct="WISKA"]{--ac:var(--ac-WISKA);}
  #acctFilter option[value="AVEDIA"]{color:var(--ac-AVEDIA);font-weight:700;}
  #acctFilter option[value="BRAINLE"]{color:var(--ac-BRAINLE);font-weight:700;}
  #acctFilter option[value="MULZI"]{color:var(--ac-MULZI);font-weight:700;}
  #acctFilter option[value="ZOTIMO"]{color:var(--ac-ZOTIMO);font-weight:700;}
  #acctFilter option[value="ACMUST"]{color:var(--ac-ACMUST);font-weight:700;}
  #acctFilter option[value="ARKZO"]{color:var(--ac-ARKZO);font-weight:700;}
  #acctFilter option[value="PIVDO"]{color:var(--ac-PIVDO);font-weight:700;}
  #acctFilter option[value="KIDOCA"]{color:var(--ac-KIDOCA);font-weight:700;}
  #acctFilter option[value="WISKA"]{color:var(--ac-WISKA);font-weight:700;}

  #acctFilter option{background:var(--panel);}
  #acctFilter option[value=""]{color:var(--text);}
  .acct-badge{display:inline-block;font-weight:700;color:#0d1117;background:var(--ac);border:1px solid var(--ac);padding:2px 9px;border-radius:20px;font-size:11.5px;letter-spacing:.3px;line-height:1.4;}
  html[data-theme="light"] .acct-badge{color:#fff;}
  html[data-theme="light"] .acct-badge[data-acct="PIVDO"]{color:#1a1a1a;}
  .acct-word{font-weight:700;color:var(--ac);}
  tr[data-acct]>td:first-child{box-shadow:inset 3px 0 0 var(--ac);}
  tr[data-acct] td.acct-name,tr[data-acct] td.acct-name *{color:var(--ac)!important;font-weight:700;}
  #acctLegend{display:flex;gap:6px;padding:6px 28px 8px;overflow-x:auto;background:var(--bg);scrollbar-width:none;align-items:center;}
  #acctLegend::-webkit-scrollbar{display:none;}
  #acctLegend .lg{cursor:pointer;white-space:nowrap;}
  #acctLegend .lg.off{opacity:.35;}
  #acctLegend .lgl{font-size:11px;color:var(--text2);white-space:nowrap;margin-right:2px;}
  #acctFilter[data-acct]{color:var(--ac);border-color:var(--ac);font-weight:700;}
  @media(max-width:768px){#acctLegend{padding:4px 10px 8px;}}

  @media(max-width:768px){
    html,body{-webkit-text-size-adjust:100%;overflow-x:clip;}
    body{font-size:13px;padding-bottom:env(safe-area-inset-bottom);}
    header{position:relative;top:0;padding:10px 12px calc(10px) 12px;padding-top:calc(10px + env(safe-area-inset-top));flex-direction:column;align-items:stretch;gap:8px;}
    header h1{font-size:15px;text-align:center;}
    .hright{display:grid;grid-template-columns:1fr auto auto auto auto;gap:6px;align-items:center;}
    .hright .meta{grid-column:1/-1;order:9;text-align:center;font-size:10.5px;}
    .hright{grid-template-columns:auto auto 1fr auto !important;}
    #acctFilter{grid-column:1/-1;width:100%;min-width:0;font-size:16px;padding:8px 10px;}
    .hright button{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:7px;padding:8px 10px;font-size:12.5px;min-height:38px;}
    #notifPanel{position:fixed;top:calc(var(--bellB,90px) + 8px);bottom:auto;left:8px;right:8px;width:auto;max-height:65vh;border-radius:12px;z-index:200;overflow:visible;}
    #notifPanel #notifList{max-height:calc(65vh - 46px);overflow-y:auto;}
    #notifPanel::before{content:'';position:absolute;top:-7px;left:var(--bellX,50%);width:12px;height:12px;background:var(--panel2);border-left:1px solid var(--border);border-top:1px solid var(--border);transform:translateX(-50%) rotate(45deg);}
    nav{position:sticky;top:0;z-index:9;padding:0;padding-top:env(safe-area-inset-top);}
    #navGroups{padding:8px 10px 0;gap:5px;scrollbar-width:none;}
    #navTabs{padding:6px 10px;gap:4px;scrollbar-width:none;}
    #navGroups::-webkit-scrollbar,#navTabs::-webkit-scrollbar{display:none;}
    #navGroups button{padding:8px 13px;font-size:12.5px;}
    #navTabs button{padding:7px 11px;font-size:12.5px;border:1px solid var(--border);border-radius:20px;}

    main{padding:12px 10px 28px;}

    .kpi .sub{font-size:10.5px;line-height:1.35;}

    .table-scroll td,.table-scroll th{max-width:170px;}

    input,select,textarea{font-size:16px;}
    .loading{padding:40px 10px;}
  }
</style>
</head>
<body>
<div id="lockScreen" style="position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px">

  <div style="color:var(--text2);font-size:13px">Email aur password se login karo</div>
  <input id="lockEmail" type="email" autocomplete="username" placeholder="Email" style="background:var(--panel2);color:var(--text);border:1px solid var(--border);padding:12px 16px;border-radius:9px;font-size:16px;width:240px;text-align:center">
  <input id="lockInput" type="password" autocomplete="current-password" placeholder="Password" style="background:var(--panel2);color:var(--text);border:1px solid var(--border);padding:12px 16px;border-radius:9px;font-size:16px;width:240px;text-align:center" onkeydown="if(event.key==='Enter')tryUnlock()">
  <button onclick="tryUnlock()" style="background:var(--accent);color:#000;border:none;padding:11px 34px;border-radius:9px;cursor:pointer;font-size:15px;font-weight:600">Kholo</button>
  <div id="lockMsg" style="color:var(--red);font-size:13px;height:18px"></div>
</div>
<header>
  <h1>SANDIP · <span>Amazon Business</span></h1>
  <div class="hright">
    <select id="acctFilter" onchange="onAcctChange()"><option value="">All Accounts</option></select>
    <div class="meta" id="meta">loading…</div>
    <button id="themeBtn" onclick="toggleTheme()" title="Light / Dark">☀️</button>

      <button onclick="authLogout()" title="Logout">⎋ Logout</button>
  </div>
</header>
<div id="notifPanel">

</div>

</nav>

  <div class="view" id="v-charges"></div>
  <div class="view" id="v-receivable"></div>
</main>
<script>
const SUPABASE_URL='https://begblflwhxbbipsmxytd.supabase.co';window.SB=SUPABASE_URL;

const AUTH_KEY='dash_sb_session';
let authOK=false;
function _sess(){try{return JSON.parse(localStorage.getItem(AUTH_KEY)||'null');}catch(e){return null;}}
function _setSess(s){try{localStorage.setItem(AUTH_KEY,JSON.stringify(s));}catch(e){} H.Authorization='Bearer '+s.access_token; authOK=true;}
async function authRefresh(){
  const s=_sess(); if(!s||!s.refresh_token) return false;
  try{
    const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});
    if(!r.ok) return false; _setSess(await r.json()); return true;
  }catch(e){return false;}
}
function authShowLock(msg){authOK=false;document.getElementById('lockScreen').style.display='flex';if(msg)document.getElementById('lockMsg').textContent=msg;}
async function tryUnlock(){
  const el=document.getElementById('lockMsg');
  const email=(document.getElementById('lockEmail').value||'').trim(), pw=document.getElementById('lockInput').value||'';
  if(!email||!pw){el.textContent='Email aur password dono daalo';return;}
  el.textContent='Checking…';
  try{
    const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password:pw})});
    document.getElementById('lockInput').value='';
    if(!r.ok){el.textContent='Login nahi hua — email/password check karo';return;}
    _setSess(await r.json()); el.textContent='';
    document.getElementById('lockScreen').style.display='none'; await loadAll();
  }catch(e){el.textContent='Connection nahi hua — retry karo';}
}
async function authLogout(){
  const s=_sess();
  try{if(s)await fetch(SUPABASE_URL+'/auth/v1/logout',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+s.access_token}});}catch(e){}
  try{localStorage.removeItem(AUTH_KEY);localStorage.removeItem('dash_cache');}catch(e){}
  location.reload();
}
async function authStart(){
  const s=_sess();
  if(s&&s.expires_at&&Date.now()/1000<s.expires_at-120){_setSess(s);document.getElementById('lockScreen').style.display='none';await loadAll();return;}
  if(s&&await authRefresh()){document.getElementById('lockScreen').style.display='none';await loadAll();return;}
  authShowLock();
}

// ── SORT SYSTEM ───────────────────────────────────────────────
const SORTS={};
function sortTable(vid, col){
  if(!SORTS[vid]) SORTS[vid]={col,dir:'desc'};
  else if(SORTS[vid].col===col) SORTS[vid].dir=SORTS[vid].dir==='desc'?'asc':'desc';
  else SORTS[vid]={col,dir:'desc'};
  rerender();
}
function sorted(data, vid, defCol='', defDir='desc'){
  if(!data||!data.length) return data;
  const s=SORTS[vid]||{col:defCol,dir:defDir};
  if(!s.col) return data;
  return [...data].sort((a,b)=>{
    let av=a[s.col], bv=b[s.col];
    const isNum=!isNaN(parseFloat(av))&&!isNaN(parseFloat(bv));
    if(isNum){av=parseFloat(av)||0;bv=parseFloat(bv)||0;}
    else{av=String(av||'').toLowerCase();bv=String(bv||'').toLowerCase();}
    if(av<bv) return s.dir==='asc'?-1:1;
    if(av>bv) return s.dir==='asc'?1:-1;
    return 0;
  });
}
function sth(vid, col, label, defCol='', num=false){
  const s=SORTS[vid]||{col:defCol,dir:'desc'};
  const arrow=s.col===col?(s.dir==='desc'?' ↓':' ↑'):'';
  return `<th onclick="sortTable('${vid}','${col}')" class="${num?'num':''}" style="cursor:pointer;user-select:none;${num?'text-align:right;':''}">${label}${arrow}</th>`;
}
// sthN = numeric column (right-aligned header)
function sthN(vid, col, label, defCol=''){return sth(vid,col,label,defCol,true);}

const API_BASE=null;
const DASH_TOKEN='';  // LAN pe token chalu kiya ho to yahan wahi likho
const _tok=DASH_TOKEN?(p=>p+(p.includes('?')?'&':'?')+'token='+encodeURIComponent(DASH_TOKEN)):(p=>p);
function readURL(path){return API_BASE?_tok(`${API_BASE}/read/${path}`):`${SUPABASE_URL}/rest/v1/${path}`;}
function writeURL(path){return API_BASE?_tok(`${API_BASE}/write/${path}`):`${SUPABASE_URL}/rest/v1/${path}`;}

let QFAIL=0; // kitni queries fail hui - header me dikhta he taaki 0 ko "sab theek" na samjho
// Network blip pe 2 baar khud retry karta he (2s, 4s ruk ke). Phir bhi fail
// ho to null return - taaki purana data overwrite na ho.
async function q(path){
  for(let attempt=0;attempt<3;attempt++){
    try{
      const r=await fetch(readURL(path),{headers:H});
      if(r.status===401&&attempt<2&&await authRefresh())continue;
      if(r.status===401){authShowLock('Session khatam — dobara login karo');return null;}
      if(r.ok) return await r.json();
      if(r.status>=500&&attempt<2){await new Promise(s=>setTimeout(s,2000*(attempt+1)));continue;}
      QFAIL++;console.warn(`Query failed: ${path}: ${r.status}`);return null;
    }catch(e){
      if(attempt<2){await new Promise(s=>setTimeout(s,2000*(attempt+1)));continue;}
      QFAIL++;console.warn(`Query error: ${path}`,e);return null;
    }
  }
  return null;
}
function inr(n){if(n==null)return'—';const a=Math.abs(n),s=n<0?'-':'';if(a>=1e7)return s+'₹'+(a/1e7).toFixed(2)+'Cr';if(a>=1e5)return s+'₹'+(a/1e5).toFixed(2)+'L';if(a>=1e3)return s+'₹'+(a/1e3).toFixed(0)+'K';return s+'₹'+Math.round(a);}
function num(n){return (n==null?0:n).toLocaleString('en-IN');}
// local (IST) date string - toISOString UTC hota he isliye alag helper
function localDate(dt){dt=dt||new Date();return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}
function gpct(v){if(v==null)return'<span style="color:var(--text2)">—</span>';const c=v>=0?'gup':'gdown';const a=v>=0?'▲':'▼';return `<span class="${c}">${a} ${Math.abs(v)}%</span>`;}

// ── NOTIFICATION SYSTEM ──────────────────────────────────────
function buildAlerts(){
  const alerts=[];
  const today=new Date().toISOString().slice(0,10);
  const D=DATA;
  // FBA shipment closed + maal kam mila -> claim (Amazon window 30 din, 23 Sep 2026 se)
  (function(){
    const t0=new Date(new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'}));
    const sh=(D.inboundShort||[]).map(x=>({...x,left:x.claim_deadline?Math.round((new Date(x.claim_deadline)-t0)/86400000):99})).filter(x=>x.left>=0);
    if(!sh.length)return;
    const ids=new Set(sh.map(x=>x.shipment_id)), units=sh.reduce((s,x)=>s+ +x.qty_short,0), minLeft=Math.min(...sh.map(x=>x.left));
    alerts.push({id:'inbshort_'+[...ids].sort().join('_')+'_'+units,level:'critical',
      title:`🚨 ${ids.size} closed shipment me ${units} units kam mile — claim karo (${minLeft?minLeft+" din baaki":"AAJ aakhri din"})`,
      body:sh.slice(0,6).map(x=>`${x.account} · ${x.shipment_id} · ${x.vyapar_item||x.amazon_sku} · ${x.qty_received}/${x.qty_shipped} mila (−${x.qty_short}) · ${x.left} din`).join('\n')+(sh.length>6?`\n+${sh.length-6} aur`:'')+'\nDin baaki = pickup (IN_TRANSIT) ke din se 30 din - safe andaza, Seller Central pe ek baar check karo'});
  })();

  
  // Overdue FBA shipments
  const overdue=(D.fbaOverdue||[]).filter(x=>x.alert_level==='CRITICAL');
  if(overdue.length) alerts.push({id:'fba_critical_'+today,level:'critical',
    title:`🚨 ${overdue.length} FBA Shipments 45+ din se received nahi`,
    body:overdue.map(x=>`${x.account} · ${x.amazon_sku} · ${x.days_since_shipped} din`).join('\n')});
  
  const warn=(D.fbaOverdue||[]).filter(x=>x.alert_level==='WARNING');
  if(warn.length) alerts.push({id:'fba_warn_'+today,level:'warning',
    title:`⚠ ${warn.length} FBA Shipments 30+ din se pending`,
    body:warn.map(x=>`${x.account} · ${x.amazon_sku}`).join(', ')});

  // Reorder NOW
  const reorderNow=(D.reorder||[]).filter(x=>x.status==='REORDER NOW');
  if(reorderNow.length) alerts.push({id:'reorder_'+today,level:'warning',
    title:`📦 ${reorderNow.length} items REORDER NOW`,
    body:reorderNow.slice(0,5).map(x=>x.item_name).join(', ')+(reorderNow.length>5?'...':'')});

  // Removal shipments jo 25+ din se delivery-confirm nahi hue (pakka atke)
  const remStuckT=new Set();
  (D.removals||[]).forEach(x=>{if(+x.days_since_shipped>25)remStuckT.add(x.account+'|'+x.tracking_number);});
  if(remStuckT.size){
    const sample=(D.removals||[]).filter(x=>+x.days_since_shipped>25).slice(0,4);
    alerts.push({id:'rem_'+today,level:'critical',
      title:`🔙 ${remStuckT.size} removal shipments 25+ din se nahi mile`,
      body:sample.map(x=>`${x.vyapar_item} (${x.account}) · ${x.days_since_shipped} din · ${x.carrier||''} ${x.tracking_number||''}`).join('\n')+' — courier/Amazon se poochho'});
  }

  // SALES DATA HI PURANA HE? Sabse upar wala alarm. 4-7 Sep 2026 ko Supabase DB
  // full ho gaya tha, har write reject ho rahi thi, log me "Run completed" phir bhi
  // aa raha tha - 4 din tak SAARE 9 account ka data chup-chaap atka raha aur
  // dashboard purana data dikhata raha bina kuch bole. Ab wo chup nahi rahega.
  const lastSale=(D.daily||[]).map(x=>x.order_date).sort().pop();
  if(lastSale){
    const daysOld=Math.round((new Date(today)-new Date(lastSale))/86400000);
    if(daysOld>=2) alerts.push({id:'salestale_'+today,level:'critical',
      title:`🚨 Sales data ${daysOld} din purana he (aakhri: ${lastSale})`,
      body:'Amazon ka data DB me save nahi ho raha. Sabse aam wajah: Supabase DB full (quota) — logs\\daily_*.log me "exceed_db_size_quota" dhoondo, aur db_maintenance.py chalao. Tab tak har number purana he.'});
  }

  // FBA snapshot purana = reorder ki ginti pe bharosa mat karo
  const staleFba=(D.fbaFresh||[]).filter(x=>+x.days_old>=2);
  if(staleFba.length) alerts.push({id:'fbastale_'+today,level:'critical',
    title:`🚨 ${staleFba.length} accounts ka FBA stock data ${Math.max(...staleFba.map(x=>+x.days_old))} din purana he`,
    body:staleFba.map(x=>`${x.account} (${x.latest_snapshot})`).join(', ')+' — daily pull check karo, tab tak REORDER ke numbers pe bharosa mat karna'});

  // Naye SKUs bina mapping ke bik rahe
  const hwSell=(D.mappingHW||[]).filter(x=>+x.units_30d>0);
  if(hwSell.length) alerts.push({id:'maphw_'+today,level:'warning',
    title:`🧩 ${hwSell.length} naye SKUs bina mapping ke bik rahe hain`,
    body:hwSell.slice(0,4).map(x=>`${x.amazon_sku} (${x.account})`).join(', ')+' — Overview ke Homework card me dekho'});

  // Missing units (noncompliance)
  const nc=(D.noncomp||[]).filter(x=>+x.qty_missing>0);
  if(nc.length) alerts.push({id:'nc_'+today,level:'critical',
    title:`🚨 ${nc.reduce((s,x)=>s+ +x.qty_missing,0)} units missing in FBA shipments`,
    body:nc.slice(0,3).map(x=>`${x.account}: ${x.amazon_sku} - ${x.qty_missing} missing`).join('\n')});

  // Fee disputes recoverable
  const dispTotal=Math.round((D.disputes||[]).reduce((s,x)=>s+ +x.total_overcharge,0));
  if(dispTotal>1000) alerts.push({id:'disp_'+today,level:'warning',
    title:`💰 ₹${dispTotal.toLocaleString('en-IN')} fee overcharge recoverable`,
    body:`${(D.disputes||[]).length} SKUs · Amazon case file karo`});

  // Stranded inventory
  const strand=(D.strandedData||[]);
  if(strand.length) alerts.push({id:'strand_'+today,level:'info',
    title:`⚠ ${strand.length} SKUs stranded at Amazon FC`,
    body:`Listing fix karo — ${strand.slice(0,3).map(x=>x.amazon_sku).join(', ')}`});

  // High return rate
  const highRet=(D.returnsSumm||[]).filter(x=>+x.return_pct>10);
  if(highRet.length) alerts.push({id:'ret_'+today,level:'warning',
    title:`📦 ${highRet.length} products ka return rate >10%`,
    body:highRet.slice(0,3).map(x=>`${x.vyapar_item||x.amazon_sku}: ${x.return_pct}%`).join(', ')});

  // Velocity alerts
  const trending=(D.velocity||[]).filter(x=>x.velocity_alert==='TRENDING UP');
  const slowing=(D.velocity||[]).filter(x=>x.velocity_alert==='SLOWING DOWN');
  if(trending.length) alerts.push({id:'vel_up_'+today,level:'info',
    title:`📈 ${trending.length} items fast move kar rahe hain is week`,
    body:trending.slice(0,3).map(x=>`${x.vyapar_item} (${x.account}): +${x.week_change_pct}%`).join('\n')});
  if(slowing.length) alerts.push({id:'vel_dn_'+today,level:'warning',
    title:`📉 ${slowing.length} items slow ho gaye hain is week`,
    body:slowing.slice(0,3).map(x=>`${x.vyapar_item} (${x.account}): ${x.week_change_pct}%`).join('\n')});
  const belowCogs=(D.reimbData||[]).filter(x=>x.below_cogs);
  if(belowCogs.length) alerts.push({id:'reimb_cogs_'+today,level:'warning',
    title:`💸 ${belowCogs.length} reimbursements COGS se kam`,
    body:belowCogs.slice(0,3).map(x=>`${x.amazon_sku}`).join(', ')+' — dispute karo'});

  return alerts;
}

function updateNotifications(){
  const alerts=buildAlerts();
  const seen=JSON.parse(localStorage.getItem('notif_seen')||'[]');
  const unread=alerts.filter(a=>!seen.includes(a.id));
  const badge=document.getElementById('notifBadge');
  const list=document.getElementById('notifList');
  if(unread.length>0){badge.style.display='flex';badge.textContent=unread.length;}
  else{badge.style.display='none';}
  if(!list) return;
  list.innerHTML=alerts.length?alerts.map(a=>{
    const isUnread=!seen.includes(a.id);
    const col=a.level==='critical'?'var(--neg)':a.level==='warning'?'#f0b429':'var(--accent)';
    return `<div class="notif-item ${isUnread?'unread':''}" onclick="openNotif('${a.id}')" title="Click = us tab pe jao">
      <div class="notif-title" style="color:${col}">${a.title}</div>
      <div class="notif-body">${a.body.replace(/\n/g,'<br>')}</div>
    </div>`;
  }).join(''):'<div style="padding:20px;text-align:center;color:var(--text2);font-size:13px">✓ Koi alert nahi</div>';
}

function toggleNotif(){
  document.getElementById('notifPanel').classList.toggle('open');
}
function readNotif(id){
  const seen=JSON.parse(localStorage.getItem('notif_seen')||'[]');
  if(!seen.includes(id)) seen.push(id);
  localStorage.setItem('notif_seen',JSON.stringify(seen));
  updateNotifications();
}
// Notification pe click = us kaam wale tab pe le jao
function notifTarget(id){
  if(id.startsWith('fba_'))return'fba_inbound';      // overdue FBA shipments
  if(id.startsWith('rem_'))return'fba_inbound';
  if(id.startsWith('inbshort_'))return'fba_inbound';  // closed shipment me kam maal      // removal nahi mila
  if(id.startsWith('reorder_'))return'reorder';
  if(id.startsWith('nc_'))return'returns';           // FC missing units
  if(id.startsWith('strand_'))return'returns';       // stranded
  if(id.startsWith('ret_'))return'returns';          // high return rate
  if(id.startsWith('disp_'))return'disputes';
  if(id.startsWith('vel_'))return'velocity';
  if(id.startsWith('reimb_'))return'reimb';
  if(id.startsWith('maphw_'))return'overview';       // homework card
  return null;
}
function openNotif(id){
  readNotif(id);
  const v=notifTarget(id);
  if(v)go(v);
  document.getElementById('notifPanel').classList.remove('open');
}
function markAllRead(){
  const alerts=buildAlerts();
  localStorage.setItem('notif_seen',JSON.stringify(alerts.map(a=>a.id)));
  updateNotifications();
  document.getElementById('notifPanel').classList.remove('open');
}
// Close notif panel when clicking outside
document.addEventListener('click',e=>{

  const btn=document.getElementById('notifBtn');
  if(panel&&btn&&!panel.contains(e.target)&&!btn.contains(e.target)){

});

  if(!known.has(item)&&!confirm(`"${item}" Vyapar ki item list me nahi mila.\nNaya naam he to pehle Vyapar me item banao (warna COGS 0 rahega).\n\nPhir bhi is naam se map karein?`))return;
  btn.disabled=true;btn.textContent='...';
  try{

      method:'POST',

      body:JSON.stringify([{account:acct,amazon_sku:sku,vyapar_item:item,is_active:true}])});

    // Alert resolve karo taaki list se hat jaye

    DATA.mappingHW=await q('mapping_homework?limit=200')||[];
    DATA.fbaCogsMiss=await q('fba_cogs_missing?order=fba_units.desc&limit=200')||[];

}

function copyClaim(btn,orderId,tracking,shipped,qty,sku){
  const txt=`Hello,

I am writing regarding my removal order ${orderId}.

A removal shipment of ${qty} unit(s) (SKU: ${sku}) was dispatched from your fulfilment centre on ${shipped}${tracking?` with tracking number ${tracking}`:''}, but it has NEVER been delivered to my address. It has now been significantly more than 30 days since dispatch, which is well beyond the expected delivery window for removal orders.

The tracking number is no longer traceable in any system, and there is no proof of delivery available.

As per Amazon's FBA removal policy, since the shipment is lost in transit and was never delivered, I request reimbursement for these ${qty} unit(s).

Removal Order ID: ${orderId}
Ship date: ${shipped}
Tracking: ${tracking||'N/A'}
Quantity not received: ${qty}

Please process the reimbursement at the earliest.

Thank you.`;
  navigator.clipboard.writeText(txt).then(()=>{btn.textContent='✔ Copied!';setTimeout(()=>{btn.textContent='📋 Claim text';},2000);});
}

async function syncVyapar(btn){
  const msg=document.getElementById('coMsg');
  btn.disabled=true;msg.textContent='Vyapar sync chal raha he… (2-5 sec)';
  try{
    const r=await Promise.resolve({json:async()=>({ok:false,output:'Vyapar sync sirf PC wale dashboard se chalta he'})});
    const j=await r.json();
    if(j.ok){
      DATA.itemNames=await q('active_item_names?limit=1000')||DATA.itemNames;
      msg.textContent='✓ Sync ho gaya — naye items ab list me hain';
      renderChina();
    }else{
      msg.textContent='✗ Sync fail: '+(j.output||'').substring(0,80);
      btn.disabled=false;
    }
  }catch(e){
    msg.textContent='✗ Sync endpoint nahi mila — start_dashboard.bat se server chalao';
    btn.disabled=false;
  }
}
async function saveChinaEdit(id){
  const qty=parseInt(document.getElementById('ce_qty').value||0);
  const date=document.getElementById('ce_date').value;
  const cost=parseFloat(document.getElementById('ce_cost').value||0);
  if(!qty||qty<1){alert('Qty sahi likho');return;}
  const body={quantity:qty,order_date:date,unit_cost:cost||null,total_cost:cost?Math.round(cost*qty*100)/100:null};
  const r=await fetch(writeURL(`china_orders?id=eq.${id}`),{method:'PATCH',
    headers:{...H,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){alert('Save fail hua: '+r.status);return;}
  CH_EDIT=null;
  DATA.china=await q('china_orders?status=in.(ordered,in_transit)&order=order_date.desc');
  renderChina();
}
async function deleteChinaLine(id,name){
  if(!confirm(`"${name}" ki ye line hata dein? Wapas nahi aayegi.`))return;
  const r=await fetch(writeURL(`china_orders?id=eq.${id}`),{method:'DELETE',headers:H});
  if(!r.ok){alert('Delete fail hua: '+r.status);return;}
  DATA.china=await q('china_orders?status=in.(ordered,in_transit)&order=order_date.desc');
  renderChina();
}

async function saveChinaOrder(btn){
  const date=document.querySelector('#coLines .co-date')?.value||localDate();
  const msg=document.getElementById('coMsg');
  const rows=[...document.querySelectorAll('#coLines > div')].map(r=>({
    item:r.querySelector('.co-item').value.trim(),
    qty:parseInt(r.querySelector('.co-qty').value||0),
    cost:parseFloat(r.querySelector('.co-cost').value||0)
  })).filter(r=>r.item&&r.qty>0);
  if(!rows.length){msg.textContent='⚠ Kam se kam ek item + qty likho';return;}
  if(window.CH_SAVING)return; // double-click = do baar save, uska guard
  // Item pehle se kisi pending order me he to pehle puchh lo
  const pendingNames=new Set((DATA.china||[]).filter(x=>x.status==='ordered'||x.status==='in_transit').map(x=>x.vyapar_item));
  const dupes=[...new Set(rows.filter(r=>pendingNames.has(r.item)).map(r=>r.item))];
  if(dupes.length&&!confirm(`⚠ "${dupes.join(', ')}" pehle se pending china orders me he — table me 2 lines dikhengi.\n\nPhir bhi naya order add karein?`))return;
  window.CH_SAVING=true;
  btn.disabled=true;msg.textContent='saving…';
  const ref='CO-'+date; // ref auto-generate hota he, user ko nahi likhna padta
  const payload=rows.map(r=>({order_ref:ref,order_date:date,supplier_name:null,vyapar_item:r.item,quantity:r.qty,unit_cost:r.cost||null,total_cost:r.cost?Math.round(r.cost*r.qty*100)/100:null,status:'ordered'}));
  try{
    const res=await fetch(writeURL('china_orders'),{method:'POST',headers:{...H,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(payload)});
    if(res.ok){
      msg.textContent='✓ Save ho gaya';
      const fresh=await q('china_orders?status=in.(ordered,in_transit)&order=order_date.desc');
      if(fresh!==null)DATA.china=fresh;
      renderChina();
    }else{
      const t=await res.text();
      msg.textContent='✗ Error: '+t.substring(0,90);
      btn.disabled=false;
    }
  }catch(e){msg.textContent='✗ Network error — dobara try karo';btn.disabled=false;}
  finally{window.CH_SAVING=false;}
}

      ${sthN('v-vel','last_week','Pichla Hafta','this_week')}
      ${sthN('v-vel','this_week','Is Hafta','this_week')}
      ${sthN('v-vel','week_change','Farak','this_week')}
      ${sthN('v-vel','per_day','Roz Ka Avg','this_week')}
      ${sthN('v-vel','warehouse_stock','Stock','this_week')}
      ${sthN('v-vel','days_left_at_current_speed','Stock Kitne Din','this_week')}
    </tr></thead><tbody id="velBody"></tbody></table></div></div>`;
  drawVelTable();
  document.getElementById('velSearch').oninput=e=>{velSearch=e.target.value;drawVelTable();};
  const velSel=document.getElementById('velFilter');velSel.value=velFilter;
  velSel.onchange=e=>{velFilter=e.target.value;drawVelTable();};
}
let velSearch='',velFilter='';
// KPI cards ke wahi 3 group (upar renderVelocity me) - dobara na likhna pade isliye yahan ek jagah
const VEL_UP=['\u{1F680} NEW FAST','\u{1F525} SPEEDING UP','\u{1F4C8} UP'];
const VEL_DOWN=['\u{1F53B} DROPPING','\u{1F4C9} DOWN'];
function velMatchesFilter(x){
  if(!velFilter)return true;
  if(velFilter==='up')return VEL_UP.includes(x.trend);
  if(velFilter==='down')return VEL_DOWN.includes(x.trend);
  if(velFilter==='flat')return !VEL_UP.includes(x.trend)&&!VEL_DOWN.includes(x.trend);
  if(velFilter==='reorder')return x.days_left_at_current_speed!=null&&+x.days_left_at_current_speed<45&&+x.this_week>=7;
  return true;
}
function velLabel(t){
  t=t||'';
  if(t.includes('NEW FAST'))return'<span class="pill p-ok">\u{1F680} Naya Tez</span>';
  if(t.includes('SPEEDING'))return'<span class="pill p-ok">\u{1F525} Aur Tez Hua</span>';
  if(t.includes('UP'))return'<span class="pill p-ok">\u{1F4C8} Badha</span>';
  if(t.includes('DROPPING'))return'<span class="pill p-now">\u{1F53B} Bahut Gira</span>';
  if(t.includes('DOWN'))return'<span class="pill p-soon">\u{1F4C9} Gira</span>';
  return'<span class="pill p-none">\u27A1 Waisa Hi</span>';
}
function drawVelTable(){
  const body=document.getElementById('velBody');if(!body)return;
  let rows=(DATA.velocity||[]).filter(x=>velMatchesFilter(x)&&(!velSearch||(x.vyapar_item||'').toLowerCase().includes(velSearch.toLowerCase())));
  rows=sorted(rows,'v-vel','this_week','desc');
  const c=document.getElementById('velCount');if(c)c.textContent=rows.length+' products';
  body.innerHTML=rows.map(x=>`<tr>
    <td><b>${x.vyapar_item}</b></td>
    <td>${velLabel(x.trend)}</td>
    <td class="num">${num(+x.last_week)}</td>
    <td class="num"><b>${num(+x.this_week)}</b></td>
    <td class="num ${+x.week_change>0?'pos':+x.week_change<0?'neg':''}">${+x.week_change>0?'+':''}${num(+x.week_change)}</td>
    <td class="num">${(+x.per_day).toFixed(1)}/din</td>
    <td class="num">${num(+(x.warehouse_stock||0))}</td>
    <td class="num ${x.days_left_at_current_speed!=null&&+x.days_left_at_current_speed<45?'neg':''}">${x.days_left_at_current_speed!=null?x.days_left_at_current_speed+' din':'\u2014'}</td>
  </tr>`).join('');
}

// Pichli baar ka data cache se turant dikhao, fresh background me aata he
try{
  const c=localStorage.getItem('dash_cache');
  if(c&&_sess()){DATA=JSON.parse(c);rerender();document.getElementById('meta').textContent='cached · fresh data aa raha he…';}
}catch(e){/* purana/kharab cache - ignore */}
authStart();
// Har 10 minute me khud refresh
setInterval(loadAll,10*60*1000);
</script>

<script>function toggleTheme(){var d=document.documentElement,l=d.getAttribute("data-theme")!=="light";if(l)d.setAttribute("data-theme","light");else d.removeAttribute("data-theme");try{localStorage.setItem("dash_theme",l?"light":"dark");}catch(e){}var b=document.getElementById("themeBtn");if(b)b.textContent=l?"🌙":"☀️";var m=document.querySelector("meta[name=theme-color]");if(m)m.content=l?"#ffffff":"#0b0f17";}(function(){var l=document.documentElement.getAttribute("data-theme")==="light";var b=document.getElementById("themeBtn");if(b)b.textContent=l?"🌙":"☀️";var m=document.querySelector("meta[name=theme-color]");if(m&&l)m.content="#ffffff";})();</script>
<script>(function(){var A=["AVEDIA", "BRAINLE", "MULZI", "ZOTIMO", "ACMUST", "ARKZO", "PIVDO", "KIDOCA", "WISKA"];
var RX=new RegExp("\\b("+A.join("|")+")\\b","gi"),RT=new RegExp("\\b("+A.join("|")+")\\b","i");
function up(s){return (s||"").trim().toUpperCase();}
function words(el){var w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),ns=[],n;while(n=w.nextNode())if(RT.test(n.nodeValue)&&!n.parentNode.closest(".acct-word,.acct-badge,input,select,option,script"))ns.push(n);RX.lastIndex=0;
 ns.forEach(function(t){var f=document.createDocumentFragment(),s=t.nodeValue,last=0;s.replace(RX,function(m,g,i){f.appendChild(document.createTextNode(s.slice(last,i)));var sp=document.createElement("span");sp.className="acct-word";sp.dataset.acct=g.toUpperCase();sp.textContent=m;f.appendChild(sp);last=i+m.length;});f.appendChild(document.createTextNode(s.slice(last)));t.parentNode.replaceChild(f,t);});}
function doRow(tr){if(tr.dataset.acDone)return;tr.dataset.acDone=1;var tds=tr.children,acc=null,i;
 for(i=0;i<tds.length;i++){var c=tds[i];if(c.querySelector("input,select,button"))continue;var t=up(c.textContent);if(A.indexOf(t)>=0){acc=t;c.innerHTML='<span class="acct-badge" data-acct="'+t+'">'+t+'</span>';break;}}
 if(!acc){for(i=0;i<tds.length;i++)if(RT.test(tds[i].textContent))words(tds[i]);return;}
 tr.dataset.acct=acc;
 for(i=0;i<tds.length;i++){var c=tds[i];if(c.classList.contains("num")||c.querySelector(".acct-badge,input,select,button,.pill"))continue;
  var st=c.getAttribute("style")||"";if(c.querySelector("b,a.asin")||/mono/.test(st)||(i===0&&c.textContent.trim().length>2))c.classList.add("acct-name");}}
function legend(){if(document.getElementById("acctLegend"))return;var nav=document.getElementById("nav");if(!nav)return;var d=document.createElement("div");d.id="acctLegend";
 d.innerHTML='<span class="lgl">Accounts:</span>'+A.map(function(a){return '<span class="acct-badge lg" data-acct="'+a+'" data-v="'+a+'">'+a+'</span>';}).join("");
 d.addEventListener("click",function(e){var b=e.target.closest(".lg");if(!b)return;var s=document.getElementById("acctFilter");if(!s)return;var v=b.dataset.v;s.value=(s.value===v?"":v);if(typeof onAcctChange==="function")onAcctChange();sync();});
 nav.appendChild(d);}
function sync(){var s=document.getElementById("acctFilter");if(!s)return;var v=up(s.value);if(A.indexOf(v)>=0)s.dataset.acct=v;else delete s.dataset.acct;
 document.querySelectorAll("#acctLegend .lg").forEach(function(b){b.classList.toggle("off",!!v&&b.dataset.v!==v);});}
function scan(){document.querySelectorAll("main tbody tr:not([data-ac-done])").forEach(doRow);document.querySelectorAll(".notif-body,.notif-title").forEach(function(e){if(!e.dataset.acDone){e.dataset.acDone=1;words(e);}});legend();sync();}
var q=0;function later(){if(q)return;q=1;setTimeout(function(){q=0;scan();},60);}
new MutationObserver(later).observe(document.body,{childList:true,subtree:true});
document.addEventListener("change",function(e){if(e.target&&e.target.id==="acctFilter")sync();});scan();})();</script>
